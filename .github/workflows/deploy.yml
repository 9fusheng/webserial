name: Deploy and Sync

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2354  # <--- 【已修改】指定了正确的端口号
          source: "index.html"
          target: "/root/webserial/html/"

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config --global user.name "9fusheng"
          git config --global user.email "fu_sheng9@163.com"
          git config --global --add safe.directory '*'
          git remote add gitee https://fusheng9:${GITEE_TOKEN}@gitee.com/fusheng9/webserial.git
          git push gitee main --force