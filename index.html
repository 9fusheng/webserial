<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fusheng Serial Listener · 串口侦听器</title>
<style>
/* ============ 设计系统（主题定义） ============ */
:root{
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace;
  --r:12px;
}
body[data-theme="dark"] {
  --bg0:#070b13; --bg1:#0b101c; --bg2:#0e1524;
  --panel:#111a2c; --panel2:#0c1322; --panel3:#182338;
  --line:#1c2a45; --line2:#26375a;
  --text:#e8eef7; --text2:#9fb0c9; --text3:#5f7190;
  --accent:#38bdf8; --accent2:#6366f1; --accent-soft:rgba(56,189,248,.12);
  --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
  --bg-grad-1:rgba(56,189,248,.08);
  --bg-grad-2:rgba(99,102,241,.08);
  --viewer-bg:#04070d;
  --scroll-thumb:#24334f;
  --scroll-thumb-hover:#32456b;
  --shadow-panel:0 8px 24px rgba(0,0,0,.35);
  --shadow-toast:0 10px 30px rgba(0,0,0,.5);
}
body[data-theme="light"] {
  --bg0:#f4f7f9; --bg1:#e6ecf2; --bg2:#dbe3ec;
  --panel:#ffffff; --panel2:#f0f4f8; --panel3:#e2eaf3;
  --line:#cbd6e2; --line2:#b0c1d4;
  --text:#1e293b; --text2:#475569; --text3:#94a3b8;
  --accent:#0284c7; --accent2:#4f46e5; --accent-soft:rgba(2,132,199,.1);
  --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --bg-grad-1:rgba(2,132,199,.05);
  --bg-grad-2:rgba(79,70,229,.05);
  --viewer-bg:#f8fafc;
  --scroll-thumb:#cbd5e1;
  --scroll-thumb-hover:#94a3b8;
  --shadow-panel:0 8px 24px rgba(0,0,0,.06);
  --shadow-toast:0 10px 30px rgba(0,0,0,.1);
}
body[data-theme="eye-care"] {
  --bg0:#e8f0e8; --bg1:#d8e6d8; --bg2:#c8dec8;
  --panel:#d4e8d4; --panel2:#cbe0cb; --panel3:#bcd6bc;
  --line:#a3c2a3; --line2:#89b089;
  --text:#2c3e2c; --text2:#4a5e4a; --text3:#6b7c6b;
  --accent:#2e8b57; --accent2:#3cb371; --accent-soft:rgba(46,139,87,.15);
  --ok:#2e8b57; --warn:#d97706; --danger:#dc2626;
  --bg-grad-1:rgba(46,139,87,.05);
  --bg-grad-2:rgba(60,179,113,.05);
  --viewer-bg:#dceedc;
  --scroll-thumb:#89b089;
  --scroll-thumb-hover:#6b8e6b;
  --shadow-panel:0 8px 24px rgba(0,0,0,.08);
  --shadow-toast:0 10px 30px rgba(0,0,0,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, var(--bg-grad-1), transparent 60%),
    radial-gradient(900px 400px at -10% 110%, var(--bg-grad-2), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg0));
  color:var(--text);
  display:flex;flex-direction:column;
  min-width:850px;min-height:600px;
  overflow:hidden;
  transition: background-color .3s, color .3s;
}
::selection{background:var(--accent-soft); color:var(--text)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-corner{background:transparent}

#app{display:flex;flex-direction:column;height:100vh;padding:14px 16px 10px;gap:10px}

.topbar{
  display:flex;align-items:center;gap:18px;
  background:linear-gradient(180deg, rgba(255,255,255,.03),transparent),var(--panel);
  border:1px solid var(--line);border-radius:var(--r);
  padding:12px 16px;
  box-shadow:var(--shadow-panel);
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{
  width:42px;height:42px;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px var(--accent-soft);
}
.logo svg{width:24px;height:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand p{font-size:11px;color:var(--text3);margin-top:2px}
.conn{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10.5px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.field select,.field .portsel select{
  background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;height:32px;padding:0 8px;font-size:12.5px;outline:none;
  transition:border-color .15s, box-shadow .15s;
  min-width:86px;
}
.field select:hover{border-color:var(--line2)}
.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.portsel{display:flex;gap:6px}
.portsel select{min-width:150px}

.btn{
  border:1px solid var(--line2);background:var(--panel3);color:var(--text);
  border-radius:8px;height:32px;padding:0 14px;font-size:12.5px;font-weight:600;
  transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:#fff;min-width:108px;justify-content:center;
  box-shadow:0 4px 14px var(--accent-soft);
}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.btn.primary.connected{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,.3);color:#fff}
.btn.primary.danger{background:linear-gradient(135deg,#f87171,#dc2626);box-shadow:0 4px 14px rgba(248,113,113,.3);color:#fff}
.btn.sm{height:26px;padding:0 10px;font-size:11.5px;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line2)}
.btn.accent{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.accent:hover{background:var(--accent);color:#fff}

.toolbar{
  display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;row-gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 12px;flex-shrink:0; box-shadow:var(--shadow-panel);
}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{
  border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:600;
  padding:5px 16px;border-radius:7px;transition:all .15s;
}
.seg button:hover{color:var(--text)}
.seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.sep{width:1px;height:22px;background:var(--line)}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);cursor:pointer;user-select:none;white-space:nowrap}
.chk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.search{display:flex;align-items:center;gap:6px;flex:1 1 300px;min-width:300px;max-width:380px}
.search input{
  flex:1;min-width:130px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;height:28px;padding:0 10px;font-size:12.5px;outline:none;transition:all .15s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input.active{border-color:var(--warn)}
.alarm{display:flex;align-items:center;gap:8px}
.alarm input[type=text]{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;height:28px;padding:0 10px;font-size:12px;outline:none;width:190px;
}
.alarm input[type=text]:focus{border-color:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
.spacer{flex:1}

.switch{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .slider{
  width:32px;height:18px;border-radius:10px;background:var(--panel3);border:1px solid var(--line2);
  position:relative;transition:all .2s;flex-shrink:0;
}
.switch .slider::after{
  content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:var(--text3);transition:all .2s;
}
.switch input:checked + .slider{background:linear-gradient(135deg,#f59e0b,#ef4444);border-color:transparent}
.switch input:checked + .slider::after{left:16px;background:#fff}
.sw-label{font-size:12.5px;color:var(--text2)}

.theme-select {
  background:var(--panel2); color:var(--text); border:1px solid var(--line);
  border-radius:7px; height:26px; font-size:12px; padding:0 6px; outline:none; cursor:pointer;
}
.theme-select:focus{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}

/* ============ 接收区（虚拟滚动） ============ */
.viewer-wrap{position:relative;flex:1;min-height:200px;display:flex;flex-direction:column;overflow:visible;
  background:var(--viewer-bg);border:1px solid var(--line);border-radius:var(--r); transition: background-color .3s;}

.viewer{flex:1;overflow-y:auto;overflow-x:auto;position:relative; font-family:var(--mono);font-size:13px;}

.viewer-phantom { width: 1px; opacity: 0; pointer-events: none; }
.viewer-content { position: absolute; top: 0; left: 0; padding: 10px 14px; width: fit-content; min-width: calc(100% - 28px); }

/* 强制单行显示，保证高度一致，避免虚拟滚动计算错乱 */
.viewer .line{
  display:flex; align-items:center; height: 24px; line-height: 24px;
  color:var(--text); padding:0 2px; border-radius:4px; white-space:nowrap;
  width: max-content;
}
.viewer .line .msg{white-space:pre; flex:0 0 auto;}

.viewer .line .ts{color:var(--text3);margin-right:8px;user-select:none;font-size:12px;flex-shrink:0;}
body.ts-off .viewer .line .ts{display:none}
.viewer .line .hex{color:var(--accent)}
.viewer .line .asc{color:var(--text2);margin-left:10px}
.viewer .line mark{background:rgba(251,191,36,.35);color:var(--text);border-radius:3px;padding:0 1px}
.viewer .line.sys{color:var(--text3);font-style:italic;}
.viewer .line.sys b{color:var(--warn)}
.viewer .line.sys.err b{color:var(--danger)}
.viewer .line.txline{color:var(--accent);background:var(--accent-soft);border-left:3px solid var(--accent);padding-left:6px;border-radius:0 4px 4px 0}
.viewer .line.txline .dir{color:var(--accent);font-weight:700;margin-right:4px;user-select:none}

.st-autolog{font-size:11px;color:var(--text3);font-family:var(--mono);white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 200px;}
.st-autolog.on{color:var(--ok)}
.st-autolog.dl{color:var(--warn)}
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--text3);font-family:"Segoe UI","Microsoft YaHei",sans-serif;
}
.empty .empty-icon{width:64px;height:64px;border-radius:18px;background:var(--panel3);display:flex;align-items:center;justify-content:center;margin-bottom:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 24px var(--shadow-panel)}
.empty .empty-icon svg{width:30px;height:30px;opacity:.7}
.empty h3{font-size:15px;color:var(--text2);font-weight:600}
.empty p{font-size:12.5px}
.banner{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:#d97706;
  padding:7px 16px;border-radius:999px;font-size:12.5px;font-weight:600;backdrop-filter:blur(6px);
  box-shadow:0 6px 20px rgba(0,0,0,.1);cursor:pointer;white-space:nowrap;
}
.hidden{display:none!important}

body.alarm .viewer-wrap{animation:alarmPulse 1s ease-in-out 3}
@keyframes alarmPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}
  50%{box-shadow:0 0 0 5px rgba(248,113,113,.55), inset 0 0 40px rgba(248,113,113,.12)}
}

.sender{
  flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;display:flex;flex-direction:column;gap:8px; box-shadow:var(--shadow-panel);
}
.send-head{display:flex;align-items:center;gap:8px}
.send-title{font-size:12px;font-weight:700;color:var(--text2);margin-right:2px;letter-spacing:1px}
.send-head select{
  background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;
  height:26px;font-size:12px;padding:0 6px;outline:none;
}
.quicklist{display:flex;gap:6px;flex-wrap:wrap;flex:1;overflow:hidden;max-height:30px}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--panel3);border:1px solid var(--line);
  color:var(--text2);border-radius:999px;padding:2px 6px 2px 10px;font-size:11.5px;cursor:pointer;
  transition:all .15s;font-family:var(--mono);max-width:200px;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .x{color:var(--text3);font-size:12px;padding:0 3px;border-radius:50%}
.chip .x:hover{color:var(--danger)}
.send-row{display:flex;gap:8px}
.send-row input{
  flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;height:36px;padding:0 12px;font-size:13px;font-family:var(--mono);outline:none;transition:all .15s;
}
.send-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.send-row .btn{height:36px}

.statusbar{
  display:flex;align-items:center;gap:16px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font-size:12px;color:var(--text2); box-shadow:var(--shadow-panel);
  flex-shrink:0;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text3);flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:dotPulse 2s infinite}
.dot.err{background:var(--danger)}
@keyframes dotPulse{
  0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}
  70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}
  100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}
}
.st-item b{color:var(--text);font-family:var(--mono);font-weight:600}
.st-item.muted{color:var(--text3)}
#st-text{font-weight:600}
#st-text.on{color:var(--ok)}
#st-text.err{color:var(--danger)}

#toasts{position:fixed;top:96px;right:16px;z-index:999;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{
  background:var(--panel3);border:1px solid var(--line2);color:var(--text);
  padding:10px 14px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow-toast);
  animation:toastIn .25s ease;display:flex;gap:8px;align-items:flex-start;backdrop-filter:blur(8px);
}
.toast.info{border-left:3px solid var(--accent)}
.toast.ok{border-left:3px solid var(--ok)}
.toast.warn{border-left:3px solid var(--warn)}
.toast.err{border-left:3px solid var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

.unsupported{
  position:fixed;top:0;left:0;right:0;z-index:1000;background:#7f1d1d;color:#fecaca;
  text-align:center;padding:8px;font-size:13px;font-weight:600;
}
</style>
</head>
<body data-theme="dark">
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04121f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3v3M15 3v3M7 6h10l1 3v4a4 4 0 0 1-8 0V9l-1-3z"/>
          <circle cx="12" cy="13" r="1.6" fill="#04121f"/>
          <path d="M12 17v4"/>
        </svg>
      </div>
      <div>
        <h1>fusheng Serial Listener</h1>
        <p>串口侦听器 · 单文件本地运行（Web Serial）</p>
      </div>
    </div>
    <div class="conn">
      <div class="field">
        <label>端口</label>
        <div class="portsel">
          <select id="sel-port"><option value="">未授权端口，请点击选择…</option></select>
          <button id="btn-pick" class="btn ghost sm" title="打开系统端口选择器" aria-label="打开系统端口选择器">选择…</button>
        </div>
      </div>
      <div class="field">
        <label>波特率</label>
        <select id="sel-baud"></select>
      </div>
      <div class="field">
        <label>数据位</label>
        <select id="sel-data">
          <option value="8">8</option>
          <option value="7">7</option>
        </select>
      </div>
      <div class="field">
        <label>停止位</label>
        <select id="sel-stop">
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
      </div>
      <div class="field">
        <label>校验</label>
        <select id="sel-parity">
          <option value="none">无</option>
          <option value="even">偶校验</option>
          <option value="odd">奇校验</option>
        </select>
      </div>
      <div class="field">
        <label>流控</label>
        <select id="sel-flow">
          <option value="none">无</option>
          <option value="hardware">硬件 RTS/CTS</option>
        </select>
      </div>
      <div class="field">
        <label>编码</label>
        <select id="sel-enc">
          <option value="utf-8">UTF-8</option>
          <option value="gbk">GBK</option>
          <option value="latin1">Latin-1</option>
        </select>
      </div>
      <button id="btn-connect" class="btn primary" aria-label="连接或断开串口">连接</button>
    </div>
  </header>

  <section class="statusbar">
    <span class="st-item" id="st-clock">--:--:--</span>
    <span class="st-item">接收 <b id="st-rx">0 B</b></span>
    <span class="st-item">速率 <b id="st-rate">0 B/s</b></span>
    <span class="st-item">发送 <b id="st-tx">0 B</b></span>
    <span class="st-item" id="st-params"></span>
    <span class="spacer"></span>
    <span class="dot" id="st-dot"></span>
    <span id="st-text">未连接</span>
  </section>

  <section class="toolbar">
    <div class="seg" id="seg-mode">
      <button data-mode="ascii" class="on">文本</button>
      <button data-mode="hex">HEX</button>
    </div>
    <div class="sep"></div>
    <select id="sel-theme" class="theme-select" title="切换显示主题">
      <option value="auto">🌓 自动</option>
      <option value="light">☀️ 白天</option>
      <option value="dark">🌙 夜间</option>
      <option value="eye-care">🌿 护眼</option>
    </select>
    <div class="sep"></div>
    <label class="chk"><input type="checkbox" id="chk-ts"><span>时间戳</span></label>
    <label class="chk"><input type="checkbox" id="chk-scroll"><span>自动滚动</span></label>
    <label class="chk"><input type="checkbox" id="chk-pause"><span>暂停</span></label>
    <button id="btn-clear" class="btn ghost sm" title="清空显示与日志">清空</button>
    <div class="sep"></div>
    <div class="search">
      <input id="in-filter" placeholder="过滤 / 搜索关键字…" spellcheck="false">
      <button id="btn-case" class="btn ghost sm" title="切换大小写敏感">Aa</button>
      <button id="btn-filteronly" class="btn ghost sm" title="仅显示匹配行">仅匹配</button>
    </div>
    <div class="sep"></div>
    <div class="alarm">
      <label class="switch">
        <input type="checkbox" id="chk-alarm">
        <span class="slider"></span>
        <span class="sw-label">报警</span>
      </label>
      <input type="text" id="in-alarm" placeholder="报警关键字,逗号分隔" spellcheck="false">
    </div>
    <div class="sep"></div>
    <label class="chk" title="连接成功后自动保存日志到浏览器下载目录"><input type="checkbox" id="chk-autolog"><span>自动保存日志</span></label>
    <select id="sel-logsize" class="theme-select" title="单个文件的最大容量">
      <option value="1">1 MB</option>
      <option value="2">2 MB</option>
      <option value="5">5 MB</option>
      <option value="10">10 MB</option>

<div id="toasts"></div>
<script>'use strict';
/* =====================================================================
 * Serial Listener · 串口侦听器
 * ===================================================================== */

const TEST_MODE = new URLSearchParams(location.search).has('test');

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const pad = (n, w = 2) => String(n).padStart(w, '0');

function fmtTime(d = new Date()) {
  return '[' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '.' + pad(d.getMilliseconds(), 3) + ']';
}

function fmtFileTime(d = new Date()) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '_' + pad(d.getHours()) + '-' + pad(d.getMinutes()) + '-' + pad(d.getSeconds());
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(2) + ' MB';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// 把 Web Serial / 浏览器底层英文错误翻译成中文
function errZh(e) {
  let msg = (e && e.message) || (e && e.name) || String(e);
  // 去掉 DOMException 的 "Failed to execute 'open' on 'SerialPort': " 前缀
  const m = msg.match(/Failed to execute '[^']+' on '[^']+':\s*(.*)/i);
  if (m && m[1]) msg = m[1];
  const map = [
    [/SecurityError/i, '安全错误：权限被拒绝'],
    [/NotFoundError/i, '未找到设备'],
    [/NotAllowedError/i, '操作不被允许'],
    [/NotReadableError/i, '设备不可读（可能被其他程序占用）'],
    [/InvalidStateError/i, '设备状态无效'],
    [/NetworkError/i, '网络错误'],
    [/AbortError/i, '操作已取消'],
    [/TypeError/i, '参数类型错误'],
    [/Failed to fetch/i, '网络请求失败'],
    [/Failed to open (serial )?port/i, '无法打开串口（可能被占用、已断开或无权限）'],
    [/open serial port/i, '无法打开串口（可能被占用、已断开或无权限）'],
    [/Cannot open (serial )?port/i, '无法打开串口（可能被占用或不存在）'],
    [/The port is already open|Port is already open/i, '串口已打开，请勿重复连接'],
    [/Serial port is not open|port is not open/i, '串口未打开'],
    [/Device has been removed|The device has been lost|Device is gone/i, '设备已被移除或断开'],
    [/Access denied|permission denied/i, '访问被拒绝：无串口权限'],
    [/No port selected|No port specified/i, '未选择串口'],
    [/Operation not supported|not supported/i, '操作不支持'],
    [/cancel(led|ed)? by (the )?user|user (cancelled|aborted)/i, '用户取消了操作'],
    [/buffer size|Buffer size/i, '缓冲区大小参数无效'],
    [/required member .* is not present/i, '缺少必要的串口参数'],
    [/is not a valid|Invalid value/i, '参数值无效'],
  ];
  for (const [re, zh] of map) {
    if (re.test(msg)) return zh;
  }
  // 兜底：仍是纯英文的底层异常，统一提示中文，不把英文暴露给用户
  if (/^[\x00-\x7F]+$/.test(msg)) return '串口操作失败，请检查设备连接后重试';
  return msg;
}
function hexStr(bytes) { return Array.from(bytes).map((b) => b.toString(16).padStart(2, '0').toUpperCase()).join(' '); }
function repositionToasts() {
  const box = $('#toasts');
  const hd = document.querySelector('.topbar');
  if (!box) return;
  box.style.top = ((hd ? hd.getBoundingClientRect().bottom : 80) + 12) + 'px';
}

function toast(msg, type = 'info', ms = 3200) {
  const box = $('#toasts');
  repositionToasts();
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, ms);
  setTimeout(() => el.remove(), ms + 320);
}

const Store = {
  KEY: 'serialListener.v1',
  defaults() {
    return {
      theme: 'auto',
      baud: 115200, dataBits: 8, stopBits: 1, parity: 'none', flowControl: 'none', encoding: 'utf-8',
      mode: 'ascii', showTs: true, autoScroll: false,
      caseSensitive: false, filter: '', filterOnly: false,
      alarmOn: false, alarmWords: '',
      autoLog: false,
      logLimitMB: 2,
      sendMode: 'ascii', crlf: 'none', quickSends: ['AT', 'AT+RST', 'Hello', '0102030405'],
      cmdHist: [],
      lastPortName: ''
    };
  },
  load() {
    try {
      const saved = JSON.parse(localStorage.getItem(this.KEY) || '{}');
      return Object.assign(this.defaults(), saved);
    } catch (e) { return this.defaults(); }
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(S)); } catch (e) {} }
};
let S = Store.load();

const state = {
  port: null, reader: null, writer: null, connected: false,
  lastPort: null, lastPortName: '',
  pending: '', pendingBytes: [], pendingCR: false,
  rx: 0, tx: 0,
  paused: false, pausedBuf: [], pausedBytes: 0,
  log: [],
  hexFlushTimer: null,
  cmdHist: [],
  cmdIdx: -1,
  busy: false
};

let liveDecoder = null;
let liveEncoding = null;
let lastRx = 0;
const EMPTY_STATE_HTML = '<div class="empty" id="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2-7 4 14 2-7h8"/></svg></div><h3>等待串口数据</h3><p>点击右上角「连接」选择串口，即可开始实时侦听</p></div>';

const MAX_LOG = 100000; 
const HEX_COL = 16;
const ROW_HEIGHT = 24; 
const BUFFER_ROWS = 10; 
const CONTENT_PAD_Y = 20; // .viewer-content 上下 padding 各 10px，需计入滚动高度

// 高性能批处理对象
const Batch = {
  _queue: [],
  _raf: null,
  add(entry) {
    this._queue.push(entry);
    if (!this._raf) {
      this._raf = requestAnimationFrame(() => this.flush());
    }
  },
  flush() {
    this._raf = null;
    if (!this._queue.length) return;
    
    // 1. 批量存入内存
    const items = this._queue;
    this._queue = [];
    
    for (const e of items) {
      AutoLog.push(e);
      if (e.kind === 'txt' || e.kind === 'hex') Alarm.check(e.ascii);
      
      if (state.paused) {
        // 暂停期间：数据缓存到 pausedBuf，不进 state.log，不触发渲染
        state.pausedBuf.push(e);
        state.pausedBytes += (e.ascii ? e.ascii.length : 0) + (e.hex ? e.hex.length : 0);
      } else {
        state.log.push(e);
      }
    }
    
    // 暂停时不触发渲染，只更新 banner 显示缓存数量
    if (state.paused) {
      updatePauseBanner();
      return;
    }
    
    // 2. 批量裁剪（超过 1000 条才裁剪，避免频繁触发 O(n) 操作）
    if (state.log.length > MAX_LOG + 1000) {
      state.log.splice(0, 1000);
    }
    
    // 3. 统一触发渲染
    View.updateData();
  }
};

const Theme = {
  getAutoTheme() {
    const h = new Date().getHours();
    return (h >= 6 && h < 18) ? 'light' : 'dark';
  },
  apply() {
    let active = S.theme;
    if (active === 'auto') {
      active = this.getAutoTheme();
    }
    document.body.setAttribute('data-theme', active);
    const sel = $('#sel-theme');
    if (sel) sel.value = S.theme;
  },
  init() {
    this.apply();
    setInterval(() => {
      if (S.theme === 'auto') {
        this.apply();
      }
    }, 60000);
  }
};

const View = {
  viewer: null,
  phantom: null,
  content: null,
  _renderScheduled: false,
  _isUserScrolling: false,
  _shouldScrollToBottom: false,
  _frozenScrollTop: -1,

  init() {
    this.viewer = $('#viewer');
    this.phantom = $('#viewer-phantom');
    this.content = $('#viewer-content');
    
    this.viewer.addEventListener('scroll', () => {
      const distanceToBottom = this.viewer.scrollHeight - this.viewer.scrollTop - this.viewer.clientHeight;
      this._isUserScrolling = distanceToBottom >= 50;
      this.scheduleRender();
    });

    // 窗口大小变化：强制重新设置 phantom 高度 + 完整重渲染
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        // 直接设 phantom 高度（不通过 scheduleRender 避免 guard 挡住）
        this.phantom.style.height = this.phantomHeight() + 'px';
        // 强制一次完整 render（重置 _renderScheduled guard）
        this._renderScheduled = false;
        this.render();
      }, 100);
    });
  },

  getFilteredLog() {
    if (!S.filter || !S.filterOnly) return state.log;
    return state.log.filter(e => entryMatches(e));
  },

  // 末尾半截行是否作为一行显示
  _hasPendingRow() {
    return !!state.pending && S.mode === 'ascii' && !state.paused;
  },

  // 滚动内容总高度 = 行数 × 行高 + 上下 padding
  phantomHeight() {
    const rows = this.getFilteredLog().length + (this._hasPendingRow() ? 1 : 0);
    if (rows <= 0) return 0;
    return rows * ROW_HEIGHT + CONTENT_PAD_Y;
  },

  updateData(forceScrollBottom = false) {
    const newHeight = this.phantomHeight();

    // autoScroll=false：先冻住当前 scrollTop，防止 phantom 撑高后被浏览器 scroll anchor 偷偷推高
    if (!S.autoScroll && !forceScrollBottom) {
      this._frozenScrollTop = this.viewer.scrollTop;
    } else {
      this._frozenScrollTop = -1;
    }

    this.phantom.style.height = newHeight + 'px';

    // 同步设回（phantom 高度变化会触发浏览器 scroll anchor 推 scrollTop，立刻打回）
    if (this._frozenScrollTop >= 0 && this._frozenScrollTop !== this.viewer.scrollTop) {
      this.viewer.scrollTop = this._frozenScrollTop;
    }
    
    if (S.autoScroll || forceScrollBottom) {
      this._shouldScrollToBottom = true;
    }
    this.scheduleRender();
  },

  scheduleRender() {
    if (this._renderScheduled) return;
    this._renderScheduled = true;
    requestAnimationFrame(() => {
      this._renderScheduled = false;
      this.render();
    });
  },

  render() {
    if (state.log.length === 0 && !state.pending) {
      showEmpty(true);
      this.content.innerHTML = '';
      return;
    }
    showEmpty(false);

    const log = this.getFilteredLog();
    if (log.length === 0) {
      if (this._hasPendingRow()) {
        let pText = state.pending;
        if (pText.length > 2000) pText = '...' + pText.slice(-2000);
        const msgContent = highlight(escapeHtml(pText), S.filter, S.caseSensitive) || '&nbsp;';
        this.content.innerHTML =
          `<div class="line pending" style="height:${ROW_HEIGHT}px;">` +
          (S.showTs ? '<span class="ts">' + fmtTime() + '</span>' : '') +
          '<span class="msg">' + msgContent + '</span></div>';
        this.content.style.transform = 'translateY(0px)';
      } else {
        this.content.innerHTML = '<div class="line sys"><span class="msg"><b>无匹配结果</b></span></div>';
      }
      return;
    }

    const scrollTop = this.viewer.scrollTop;
    const clientHeight = this.viewer.clientHeight;
    
    let startIdx = Math.floor(scrollTop / ROW_HEIGHT) - BUFFER_ROWS;
    let endIdx = Math.ceil((scrollTop + clientHeight) / ROW_HEIGHT) + BUFFER_ROWS;
    
    startIdx = Math.max(0, startIdx);
    endIdx = Math.min(log.length, endIdx);

    const parts = [];
    for (let i = startIdx; i < endIdx; i++) {
      const e = log[i];
      const isHexEntry = (S.mode === 'hex' || e.kind === 'hex');
      const isTx = e.kind === 'tx';
      let cls = 'line ' + (isHexEntry ? 'hexline' : 'txtline') + (isTx ? ' txline' : '') + (e.kind === 'sys' ? ' sys' : '') + (e.kind === 'sysErr' ? ' sys err' : '');
      
      let html = `<div class="${cls}" style="height:${ROW_HEIGHT}px;">`;
      if (S.showTs) html += '<span class="ts">' + e.t + '</span>';
      
      let body = (isHexEntry ? e.hex : e.ascii);
      let displayHtml = highlight(escapeHtml(body), S.filter, S.caseSensitive);
      
      html += `<span class="msg" title="${escapeHtml(body)}">`;
      if (isTx) html += '<span class="dir">→</span> ';
      html += displayHtml + '</span></div>';
      parts.push(html);
    }

    // 末尾半截行：作为普通行接在最后一条之后（不再绝对定位，避免撑出空白滚动区）
    if (endIdx === log.length && this._hasPendingRow()) {
      // 防止超长 pending 文本卡死 DOM
      let pText = state.pending;
      if (pText.length > 2000) pText = '...' + pText.slice(-2000);
      const msgContent = highlight(escapeHtml(pText), S.filter, S.caseSensitive) || '&nbsp;';
      parts.push(
        `<div class="line pending" style="height:${ROW_HEIGHT}px;">` +
        (S.showTs ? '<span class="ts">' + fmtTime() + '</span>' : '') +
        '<span class="msg">' + msgContent + '</span></div>'
      );
    }

    this.content.innerHTML = parts.join('');
    this.content.style.transform = `translateY(${startIdx * ROW_HEIGHT}px)`;

    if (this._shouldScrollToBottom) {
      this._shouldScrollToBottom = false;
      this.viewer.scrollTop = this.viewer.scrollHeight;
    }
  },

  clear() {
    // 1. 杀掉所有可能残留的异步任务
    Batch._queue = [];
    if (Batch._raf) { cancelAnimationFrame(Batch._raf); Batch._raf = null; }
    if (state.hexFlushTimer) { clearTimeout(state.hexFlushTimer); state.hexFlushTimer = null; }

    // 2. 重置数据（保留 paused 状态，只清暂停缓存）
    state.pending = ''; state.pendingBytes = []; state.pendingCR = false; state.log = [];
    state.pausedBuf = []; state.pausedBytes = 0;
    updatePauseBanner();
    state.rx = 0; state.tx = 0; lastRx = 0;
    updateCounters();

    // 3. 重置 View 内部状态
    this._isUserScrolling = false;
    this._shouldScrollToBottom = false;
    this._frozenScrollTop = -1;
    this._renderScheduled = false;
    this.viewer.scrollTop = 0;
    this.content.style.transform = 'translateY(0px)';
    this.phantom.style.height = '0px';
    showEmpty(true);

    // 4. 最后触发一次渲染
    this.scheduleRender();
  }
};

function showEmpty(on) { const e = $('#empty-state'); if (e) e.style.display = on ? '' : 'none'; }

function highlight(escaped, kw, caseSensitive) {
  if (!kw) return escaped;
  try {
    const re = new RegExp(escapeRe(escapeHtml(kw)), caseSensitive ? 'g' : 'gi');
    return escaped.replace(re, (m) => '<mark>' + m + '</mark>');
  } catch (e) { return escaped; }
}

// 数据接收核心逻辑：只管塞进 Batch 队列
function onBytes(bytes, decoder) {
  showEmpty(false);
  const isHex = S.mode === 'hex';
  
  if (isHex) {
    for (const b of bytes) {
      state.pendingBytes.push(b);
      if (state.pendingBytes.length >= HEX_COL) {
        const chunk = state.pendingBytes.splice(0, HEX_COL);
        const hex = hexStr(chunk);
        const asc = Array.from(chunk).map((b) => (b >= 32 && b <= 126 ? String.fromCharCode(b) : '.')).join('');
        Batch.add({ kind: 'hex', t: fmtTime(), ascii: asc, hex: hex + '  |' + asc + '|' });
      }
    }
    if (state.pendingBytes.length && !state.hexFlushTimer) {
      state.hexFlushTimer = setTimeout(() => {
        state.hexFlushTimer = null;
        if (state.pendingBytes.length) {
          const chunk = state.pendingBytes.splice(0, HEX_COL);
          const hex = hexStr(chunk);
          const asc = Array.from(chunk).map((b) => (b >= 32 && b <= 126 ? String.fromCharCode(b) : '.')).join('');
          Batch.add({ kind: 'hex', t: fmtTime(), ascii: asc, hex: hex + '  |' + asc + '|' });
          View.updateData();
        }
      }, 300);
    }
    return;
  }

  // 文本模式：按字节切行（\r、\n、\r\n 都算换行）
  // 好处：\r 与 \n 被拆到两次读取时也能正确换行，不依赖字符串反复截取
  let buf = bytes;
  if (!buf.length) return; // 空读取：保持 pendingCR 状态不变，等下一段数据
  // 上一次读取以 \r 结尾，本次开头的 \n 属于同一个 CRLF，跳过
  if (state.pendingCR) {
    if (buf[0] === 0x0A) buf = buf.subarray(1);
    state.pendingCR = false;
  }
  if (!buf.length) return;

  let start = 0;
  for (let i = 0; i < buf.length; i++) {
    const b = buf[i];
    // \r、\n 是换行符；0x00（NUL）是很多串口设备的填充/分隔符，也按换行处理
    if (b !== 0x0D && b !== 0x0A && b !== 0x00) continue;

    state.pending += decoder.decode(buf.subarray(start, i), { stream: true });
    pushTextLine(state.pending, b === 0x00);
    state.pending = '';

    if (b === 0x0D) {
      if (i + 1 < buf.length && buf[i + 1] === 0x0A) {
        i++; // 同一次读取内的 CRLF，\n 一起吃掉
      } else if (i + 1 === buf.length) {
        state.pendingCR = true; // \r 在末尾，可能需要和下一次读取的 \n 配对
      }
    }
    start = i + 1;
  }

  if (start < buf.length) {
    state.pending += decoder.decode(buf.subarray(start), { stream: true });
  }
  View.updateData();
}

// 把一行文本写入日志（带时间戳时忽略空行；NUL 填充产生的空段一律忽略）
function pushTextLine(line, fromNul) {
  if (line.indexOf('\uFEFF') !== -1) line = line.replace(/\uFEFF/g, '');
  if (fromNul && line.trim() === '') return;
  if (S.showTs && line.trim() === '') return;
  Batch.add({ kind: 'txt', t: fmtTime(), ascii: line, hex: hexStr(new TextEncoder().encode(line)) });
}
function viewAddTx(text, bytes) {
  showEmpty(false);
  const t = fmtTime();
  const asc = Array.from(bytes).map((b) => (b >= 32 && b <= 126 ? String.fromCharCode(b) : '.')).join('');
  const hexDisplay = hexStr(bytes) + '  |' + asc + '|';
  
  Batch.add({ kind: 'tx', t, ascii: text, hex: hexDisplay });
  Batch.flush(); // 发送后立刻刷出，不等 rAF
  View.updateData(true);
}

function viewAddSys(msg, isErr) {
  Batch.add({ kind: isErr ? 'sysErr' : 'sys', t: fmtTime(), ascii: msg, hex: '' });
  Batch.flush();
  View.updateData(true);
}

function entryMatches(e) {
  const kw = S.filter;
  if (!kw) return true;
  const text = (S.mode === 'hex' || e.kind === 'hex') ? e.hex : e.ascii;
  return S.caseSensitive ? text.includes(kw) : text.toLowerCase().includes(kw.toLowerCase());
}

function setPaused(on) {
  state.paused = on;
  $('#chk-pause').checked = on;
  updatePauseBanner();
  if (!on) {
    // 恢复暂停：先清空 Batch 残留队列，确保 pausedBuf 倒回后的数据不被旧 flush 覆盖
    if (Batch._queue.length) {
      // 如果有排队的旧数据（暂停瞬间 add 的），也一起并入 pausedBuf 再统一倒回
      for (const e of Batch._queue) state.pausedBuf.push(e);
      Batch._queue = [];
      if (Batch._raf) { cancelAnimationFrame(Batch._raf); Batch._raf = null; }
    }

    if (state.pending && S.mode !== 'hex') {
      state.pausedBuf.push({ kind: 'txt', t: fmtTime(), ascii: state.pending, hex: hexStr(new TextEncoder().encode(state.pending)) });
      state.pending = '';
    }
    if (state.hexFlushTimer) { clearTimeout(state.hexFlushTimer); state.hexFlushTimer = null; }

    // pausedBuf 全部倒入 state.log
    for (const it of state.pausedBuf) state.log.push(it);
    state.pausedBuf = []; state.pausedBytes = 0;
    updatePauseBanner();

    // 重置 View 内部状态（暂停期间用户可能滚动过，_isUserScrolling 可能为 true）
    View._isUserScrolling = false;
    View._shouldScrollToBottom = true;
    View._renderScheduled = false;
    View.scheduleRender();
  }
}

const Alarm = {
  words: [],
  setWords(s) { this.words = s.split(/[,，;；]/).map((w) => w.trim()).filter(Boolean); },
  check(text) {

    const hit = this.words.find((w) => text.includes(w));
    if (hit) this.fire(hit);
  },
  fire(hit) {
    beep();
    const body = document.body;
    body.classList.remove('alarm');
    void body.offsetWidth;
    body.classList.add('alarm');
    setTimeout(() => body.classList.remove('alarm'), 3200);
    document.title = '⚠ 报警:' + hit + ' - Serial Listener';
    setTimeout(() => { document.title = 'Serial Listener · 串口侦听器'; }, 4000);
    toast('⚠ 触发报警：' + hit, 'warn', 5000);
  }
};
let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    [[880, .18], [660, .18], [880, .22]].forEach(([f, d], i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + i * .2);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + i * .2 + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * .2 + d);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + i * .2); o.stop(t0 + i * .2 + d + .05);
    });
  } catch (e) {}
}

// 以下为 Serial 逻辑及 UI 绑定... (保持原有逻辑，只需确认 onBytes 被替换)
const Serial = {
  async ensure() { if (!navigator.serial) throw new Error('当前浏览器不支持 Web Serial API'); },
  async refreshPorts(selectName) {
    try {
      await this.ensure();
      const ports = await navigator.serial.getPorts();
      const sel = $('#sel-port');
      sel.innerHTML = '';
      if (!ports.length) {
        sel.innerHTML = '<option value="">未授权端口，请点击选择…</option>';
      } else {
        ports.forEach((p, i) => {
          const o = document.createElement('option');
          o.value = String(i);
          o.textContent = portName(p, i);
          sel.appendChild(o);
        });
        if (selectName) {
          const idx = ports.findIndex((p) => portName(p) === selectName);
          if (idx >= 0) sel.value = String(idx);
        }
      }
      state.grantedPorts = ports;
    } catch (e) { toast('刷新端口失败：' + errZh(e), 'err'); }
  },
  async pickPort() {
    await this.ensure();
    try {
      const port = await navigator.serial.requestPort();
      state.lastPort = port;
      state.lastPortName = portName(port);
      S.lastPortName = state.lastPortName; Store.save();
      await this.refreshPorts(state.lastPortName);
      return port;
    } catch (e) { 
      state.lastPort = null;
      state.lastPortName = '';
      return null; 
    }
  },
  getOpts() { return { baudRate: Number(S.baud), dataBits: Number(S.dataBits), stopBits: Number(S.stopBits), parity: S.parity, flowControl: S.flowControl }; },
  async connect(port, opts) {
    state.busy = true; updateConnectBtn();
    try {
      await port.open(opts);
      state.port = port;
      state.writer = port.writable.getWriter();
      state.connected = true;
      state.busy = false;
      state.lastPort = port;
      state.lastPortName = portName(port);
      setStatus(true, state.lastPortName);
      updateConnectBtn();
      viewAddSys('已连接 ' + state.lastPortName + ' @ ' + opts.baudRate);
      AutoLog.start();
      this.readLoop(port);
      return true;
    } catch (e) {
      state.busy = false;
      updateConnectBtn();
      setStatus(false, errZh(e)); // 状态栏报错
      toast('连接失败：' + errZh(e), 'err');
      return false;
    }
  },
  async readLoop(port) {
    const enc = S.encoding === 'latin1' ? 'windows-1252' : S.encoding;
    if (!liveDecoder || liveEncoding !== enc) {
      liveDecoder = new TextDecoder(enc, { fatal: false });
      liveEncoding = enc;
    }
    let reader = null;
    try {
      while (state.port === port && port.readable) {
        reader = port.readable.getReader();
        state.reader = reader;
        let streamEnded = false;
        try {
          for (;;) {
            const { value, done } = await reader.read();
            if (done) { streamEnded = true; break; }
            if (state.port !== port) break;
            state.rx += value.length;
            updateCounters();
            onBytes(new Uint8Array(value), liveDecoder);
          }
        } finally {
          try { reader.releaseLock(); } catch (e) {}
          state.reader = null;
        }
        if (streamEnded && state.port === port) {
          onDisconnected('连接已断开（串口流结束）');
          break;
        }
      }
    } catch (e) {
      if (state.port === port) onDisconnected('读取异常：' + errZh(e));
    }
  },
  async disconnect(quiet) {
    const port = state.port;
    if (!port) return;
    state.port = null;
    if (state.writer) { try { state.writer.releaseLock(); } catch (e) {} state.writer = null; }
    if (state.reader) { try { await state.reader.cancel(); } catch (e) {} state.reader = null; }
    try { await port.close(); } catch (e) {}
    state.connected = false;
    await AutoLog.stop();
    setStatus(false);
    updateConnectBtn();
    if (!quiet) viewAddSys('已断开连接', true);
  },
  async send(bytes) {
    const port = state.port;
    if (!port || !port.writable) { toast('请先连接串口', 'warn'); return false; }
    const writer = state.writer;
    if (!writer) { toast('发送通道未就绪', 'warn'); return false; }
    try {
      await writer.write(bytes);
      state.tx += bytes.length;
      updateCounters();
      return true;
    } catch (e) {
      toast('发送失败：' + errZh(e), 'err');
      if (state.port === port) onDisconnected('写入异常：' + errZh(e));
      return false;
    }
  }
};
function portName(p, idx) {
  try {
    const i = p.getInfo();
    if (i.usbVendorId) return 'USB#' + i.usbVendorId.toString(16) + ':' + i.usbProductId.toString(16);
  } catch (e) {}
  return '串口 #' + (idx === undefined || idx < 0 ? '?' : idx + 1);
}

const AutoLog = {
  on: false, mode: 'none',
  _downloadBuf: '',
  timer: null, _baseTs: 0, _seg: 0,

  start() {
    if (!this.on) return;
    this.mode = 'download';
    this._downloadBuf = '';
    this._seg = 0;
    this._baseTs = Date.now();

    const head = [
      '# 串口侦听器 - 自动日志',
      '# 开始: ' + new Date().toLocaleString('zh-CN'),
      '# TX 行以 → 标记', '#'
    ].join('\r\n') + '\r\n';
    this._downloadBuf += head;

    this.timer = setInterval(() => { this.flush(); this.updateStatus(); }, 2000);
    this.updateStatus();
  },

  _fname() {
    const t = new Date(this._baseTs);
    const base = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()) + '_'
               + pad(t.getHours()) + '-' + pad(t.getMinutes()) + '-' + pad(t.getSeconds());
    return base + (this._seg > 0 ? '_' + pad(this._seg, 3) : '') + '.log';
  },

  _line(e) {
    const body = (S.mode === 'hex' || e.kind === 'hex') ? e.hex : e.ascii;
    return e.t + '  ' + (e.kind === 'tx' ? '→ ' : '') + body + '\r\n';
  },

  push(e) {
    if (!this.on || this.mode === 'none') return;
    this._downloadBuf += this._line(e);

    const maxLimit = (S.logLimitMB || 2) * 1024 * 1024; 
    if (this._downloadBuf.length >= maxLimit) this._rotate();
  },

  _rotate() {
    if (this._downloadBuf) {
      this._triggerDownload();
    }
    this._seg++;
  },

  async flush() {
    // download 模式数据一直在 _downloadBuf 里积累，不需要中间 flush
    // 这里只是个 placeholder，防止并发访问问题
  },

  _triggerDownload() {
    if (!this._downloadBuf) return;
    const blob = new Blob([this._downloadBuf], { type: 'text/plain;charset=utf-8' });
    this._downloadBuf = '';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = this._fname();
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },

  async stop() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.mode === 'none') { this.updateStatus(); return; }
    if (this._downloadBuf) { this._triggerDownload(); }
    this.mode = 'none';
    this.updateStatus();
  },

  updateStatus() {
    const el = $('#st-autolog');
    if (!el) return;
    if (!this.on) { el.textContent = ''; el.className = 'st-autolog'; return; }
    if (this.mode === 'download') { el.textContent = '保存中: ' + (this._downloadBuf.length > 0 ? fmtBytes(this._downloadBuf.length) : ''); el.className = 'st-autolog dl'; }
    else { el.textContent = '待连接'; el.className = 'st-autolog'; }
  }
};

function parseHexInput(s) {
  const clean = s.replace(/[\s,，]+/g, '');
  if (!clean) return null;
  if (!/^[0-9a-fA-F]+$/.test(clean)) throw new Error('HEX 内容含非法字符');
  if (clean.length % 2 !== 0) throw new Error('HEX 长度必须为偶数（每字节 2 位）');
  const out = new Uint8Array(clean.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(clean.substr(i * 2, 2), 16);
  return out;
}
async function doSend() {
  const raw = $('#in-send').value;
  if (!raw) return;
  if (!state.cmdHist.length || state.cmdHist[state.cmdHist.length - 1] !== raw) {
    state.cmdHist.push(raw);
    if (state.cmdHist.length > 50) state.cmdHist.shift();
  }
  state.cmdIdx = -1;
  Store.save();
  let bytes;
  try {
    if (S.sendMode === 'hex') {
      bytes = parseHexInput(raw);
      if (!bytes) return;
    } else {
      const CRLF_MAP = { 'none': '', 'CR': '\r', 'LF': '\n', 'CRLF': '\r\n' };
      const crlf = CRLF_MAP[S.crlf] || '';
      bytes = new TextEncoder().encode(raw + crlf);
    }
  } catch (e) { toast('发送失败：' + errZh(e), 'err'); return; }
  const ok = await Serial.send(bytes);
  if (ok) {
    viewAddTx(raw, bytes);
    toast('已发送 ' + bytes.length + ' 字节', 'ok', 1500);
  }
}
function histPrev() {
  if (!state.cmdHist.length) return;
  state.cmdIdx = state.cmdIdx < 0 ? state.cmdHist.length - 1 : Math.max(0, state.cmdIdx - 1);
  $('#in-send').value = state.cmdHist[state.cmdIdx];
}
function histNext() {
  if (state.cmdIdx < 0) return;
  state.cmdIdx++;
  if (state.cmdIdx >= state.cmdHist.length) { state.cmdIdx = -1; $('#in-send').value = ''; }
  else $('#in-send').value = state.cmdHist[state.cmdIdx];
}

function exportLog() {
  if (!state.log.length) { toast('没有可导出的数据', 'warn'); return; }
  
  const lines = state.log.map((e) => { 
    if (S.filterOnly && S.filter && !entryMatches(e)) return null;
    if (S.showTs && e.kind !== 'hex' && e.kind !== 'tx' && e.ascii.trim() === '') return null;

    let rawBody = (S.mode === 'hex' || e.kind === 'hex') ? e.hex : e.ascii;
    rawBody = rawBody.replace(/\t/g, '    ').replace(/ {2,}/g, '\t');

    const ts = S.showTs ? e.t + ' ' : '';
    const dir = (e.kind === 'tx' ? '→ ' : '');
    return ts + dir + rawBody;
  }).filter(Boolean); 

  const content = lines.join('\r\n');
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fmtFileTime() + '.txt'; 
  
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('已导出 TXT 文件：' + a.download, 'ok');
}

      toast('请先在系统对话框中选择串口', 'warn');
      port = await Serial.pickPort();
      if (!port) return;
    }
    
    const ok = await Serial.connect(port, opts);
    if (!ok) {
      state.lastPort = null;
      state.lastPortName = '';
      S.lastPortName = '';
      Store.save();
    }
  } catch(e) {
    console.error(e);
    toast('连接异常：' + errZh(e), 'err');
  } finally {
    state.busy = false;
    updateConnectBtn();
  }
}
function maybeApplyParams(label) {
  if (state.connected && state.lastPort) {
    toast(label + '已修改，正在重新打开端口…', 'info');
    (async () => {
      await Serial.disconnect(true);
      await Serial.connect(state.lastPort, Serial.getOpts());
    })();
  }
}

function setStatus(connected, name) {
  const dot = $('#st-dot'), txt = $('#st-text');
  dot.className = 'dot ' + (connected ? 'on' : 'err');
  txt.className = connected ? 'on' : 'err';
  
  if (connected) {
    txt.textContent = '已连接 ' + name;
    // 显示串口参数：波特率 / 数据位 / 停止位 / 校验
    const parityMap = { none: '无', even: '偶', odd: '奇' };
    const params = S.baud + ' / ' + S.dataBits + S.parity[0].toUpperCase() + S.stopBits;
    $('#st-params').textContent = '参数: ' + params;
  } else {
    if (name) {
       txt.textContent = '未连接 (' + name + ')';
    } else {
       txt.textContent = '未连接';
    }
    $('#st-params').textContent = '';
  }
}
function updateCounters() {
  $('#st-rx').textContent = fmtBytes(state.rx);
  $('#st-tx').textContent = fmtBytes(state.tx);
}
async function onDisconnected(msg) {
  state.connected = false;
  state.busy = false;
  state.port = null;
  if (state.writer) { try { state.writer.releaseLock(); } catch (e) {} state.writer = null; }
  await AutoLog.stop();
  setStatus(false);
  updateConnectBtn();
  viewAddSys(msg, true);
  toast(msg, 'err');
}
function updateConnectBtn() {
  const b = $('#btn-connect');
  if (state.busy) { b.disabled = true; b.textContent = '连接中…'; b.className = 'btn primary'; return; }
  b.disabled = false;
  if (state.connected) {
    b.textContent = '断开';
    b.className = 'btn primary connected';
  } else if (state.lastPort) {
    b.textContent = '重连';
    b.className = 'btn primary';
  } else {
    b.textContent = '连接';
    b.className = 'btn primary';
  }
}

function tickClock() {
  const d = new Date();
  $('#st-clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

async function init() {
  populateBaud();
  applySettingsToUI();
  Theme.init();
  View.init();
  bindUI();
  window.addEventListener('resize', repositionToasts);
  repositionToasts();
  tickClock();
  setInterval(tickClock, 1000);
  state.cmdHist = S.cmdHist || [];
  setInterval(() => {
    const cur = state.rx;
    $('#st-rate').textContent = fmtBytes(cur - lastRx) + '/s';
    lastRx = cur;
  }, 1000);
  if (!navigator.serial) {
    const bar = document.createElement('div');
    bar.className = 'unsupported';
    bar.textContent = '⚠ 当前浏览器不支持 Web Serial API，请使用 Chrome 或 Edge 打开本文件';
    document.body.prepend(bar);
    return;
  }
  await Serial.refreshPorts(S.lastPortName);
}
init();
</script>
</body>
</html>
